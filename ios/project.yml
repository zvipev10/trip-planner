name: TripPlanner
options:
  bundleIdPrefix: com.tripplanner
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.2.0'
    CURRENT_PROJECT_VERSION: '2'
targets:
  TripPlanner:
    type: application
    platform: iOS
    sources:
      - path: TripPlanner
        excludes: ['Info-Debug.plist', 'Info-Release.plist']
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tripplanner.ios
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Debug:
          INFOPLIST_FILE: TripPlanner/Info-Debug.plist
        Release:
          INFOPLIST_FILE: TripPlanner/Info-Release.plist
  TripPlannerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TripPlannerTests]
    dependencies:
      - target: TripPlanner
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TripPlanner:
    build:
      targets:
        TripPlanner: all
    test:
      targets: [TripPlannerTests]
