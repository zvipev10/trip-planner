<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#193c34" />
    <meta name="apple-mobile-web-app-title" content="Trip Planner" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2716%27 fill=%27%23173b32%27/%3E%3Cpath d=%27M18 46L46 18M20 18h26v26%27 stroke=%27%23e5edbd%27 stroke-width=%275%27 fill=%27none%27/%3E%3C/svg%3E"
    />
    <title>Trip Planner · A better order to your day</title>
    <link rel="stylesheet" href="./leaflet.css" />
    <link rel="stylesheet" href="./style.css?v=0.3.0" />
  </head>
  <body>
    <header class="masthead">
      <a class="brand" href="#" aria-label="Trip Planner home"
        ><span class="brandmark" aria-hidden="true"
          ><svg class="icon" viewBox="0 0 16 16">
            <path
              d="M3 13L13 3M4 3h9v9"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
            /></svg></span
        ><span
          >Trip Planner<small>LESS DISTANCE. MORE DISCOVERY.</small></span
        ></a
      ><span class="local-tag">Saved on this device</span>
    </header>
    <main id="app"></main>
    <div
      id="notice"
      class="notice"
      role="status"
      aria-live="polite"
      hidden
    ></div>
    <dialog id="editor" aria-labelledby="editor-title">
      <form id="place-form">
        <div class="dialog-head">
          <div>
            <span class="eyebrow">YOUR PLACES</span>
            <h2 id="editor-title">Add a location</h2>
          </div>
          <button
            type="button"
            class="icon-button"
            data-close
            aria-label="Close editor"
          >
            ×
          </button>
        </div>
        <input type="hidden" name="id" /><label
          >Place name (optional)<input
            name="name"
            maxlength="200"
            autocomplete="off"
            placeholder="A café, a lookout, a friend’s place…" /></label
        ><label
          >Address or shared link<textarea
            name="address"
            rows="2"
            maxlength="16000"
            placeholder="Paste from Google Maps or Waze"
          ></textarea></label
        ><button type="button" class="text-button" id="extract">
          Retry link extraction
        </button>
        <p class="help">
          Coordinates and place names are extracted automatically from supported map links. You can edit them below.
        </p>
        <div class="coordinate-fields">
          <label
            >Latitude<input
              name="latitude"
              inputmode="decimal"
              placeholder="32.0800" /></label
          ><label
            >Longitude<input
              name="longitude"
              inputmode="decimal"
              placeholder="34.7800"
          /></label>
        </div>
        <p id="form-error" class="field-error" role="alert"></p>
        <div class="dialog-actions">
          <button type="button" class="secondary" data-close>Cancel</button
          ><button type="submit">Save location</button>
        </div>
      </form>
    </dialog>
    <script src="./leaflet.js"></script>
    <script type="module" src="./app.mjs?v=0.3.0"></script>
  </body>
</html>
