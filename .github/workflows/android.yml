name: Android build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Load persistent APK signing identity
        env:
          SIGNING_STORE: ${{ secrets.TRIP_SIGNING_STORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.TRIP_SIGNING_PASSWORD }}
        run: |
          if [ -z "$SIGNING_STORE" ] || [ -z "$SIGNING_PASSWORD" ]; then
            if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "Missing stable signing secrets; refusing to publish a differently signed upgrade."
              exit 1
            fi
            echo "Temporary debug identity; this PR artifact is not an upgrade distribution."
          else
            umask 077
            printf '%s' "$SIGNING_STORE" | base64 --decode > "$RUNNER_TEMP/trip-planner.jks"
            echo "TRIP_SIGNING_STORE=$RUNNER_TEMP/trip-planner.jks" >> "$GITHUB_ENV"
          fi
      - run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
        env:
          TRIP_SIGNING_PASSWORD: ${{ secrets.TRIP_SIGNING_PASSWORD }}
      - name: Record signing certificate
        if: env.TRIP_SIGNING_STORE != ''
        run: |
          "$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)" verify --print-certs app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/signing-certificate.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TRIP_SIGNING_STORE != '' && 'trip-planner-debug' || 'trip-planner-ci-debug' }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/signing-certificate.txt
          retention-days: 7
